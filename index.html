<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>JUEGO - Cibertec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body>
    <div>
      <h1>Juego de Piedra, Papel y Tijeras!</h1>
    </div>

    <main>
      <div class="main_intro">
        <h2 class="intro__title">¡ELIGE TU JUGADA!</h2>
        <P class="intro__text">¿Podrás vencer a la computadora?</P>
        <p class="intro__tips">¡Solo tienes 5 intentos para ganar!</p>
      </div>

      <div class="cont">
        <div class="cont__box">
          <p class="cont__jugador1"><span id="scoreJugador1">0</span></p>
          <p class="cont_jugador1_text">JUGADOR</p>
        </div>
        <div class="cont__box">
          <p class="cont__jugador2"><span id="scoreJugador2">0</span></p>
          <p class="cont_jugador1_text">MÁQUINA</p>
        </div>
      </div>

      <section class="game">
        <h2 class="game__title">TU JUGADA VS COMPUTADORA</h2>

        <div class="game__players">
          <span id="jugador" class="player1"></span>
          <span class="game__vs">VS</span>
          <span id="maquina" class="player2"></span>
        </div>
        <p class="game__text">¡A JUGAR!</p>
        <div class="game__stats">
          <h2><span id="resultado"></span></h2>
        </div>
      </section>

      <section class="options">
        <p class="options__text">SELECCIONA TU OPCIÓN</p>

        <div class="options__btn">
          <button id="piedra" class="btn__rock">
            <img src="./assets/icons/rock_non_bg.png" alt="scissors image">
          </button>

          <button id="papel" class="btn__paper">
            <img src="./assets/icons/paper_non_bg.png" alt="paper image">
          </button>

          <button id="tijeras" class="btn__scissors">
            <img src="./assets/icons/scissors_non_bg.png" alt="scissors image">
          </button>
        </div>
      </section>

      <footer>
        <p>i202502036@cibertec.edu.pe</p>
      </footer>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
